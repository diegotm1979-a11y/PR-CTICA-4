<script type="text/babel" data-presets="react">
async function exportSvgToPngBlob(svgEl, scale) {
  scale = scale || 4;
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const style = getComputedStyle(document.documentElement);
  const pitchColor = style.getPropertyValue('--pitch').trim() || '#2f7d3c';
  const xml = new XMLSerializer().serializeToString(clone);
  const svg64 = btoa(unescape(encodeURIComponent(xml)));
  const image64 = 'data:image/svg+xml;base64,' + svg64;
  const img = new Image();
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = image64; });
  const vb = svgEl.viewBox.baseVal;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vb.width * scale);
  canvas.height = Math.round(vb.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = pitchColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function CampogramaTab({ match, setMatches, canEdit }) {
  const { players } = useAppData();
  const toast = useToast();
  const confirm = useConfirm();
  const svgRef = useRef(null);
  const [activeIdx, setActiveIdx] = useState(0);
  const [tool, setTool] = useState('mover');
  const [dragId, setDragId] = useState(null);
  const [drawTmp, setDrawTmp] = useState(null);
  const [pendingText, setPendingText] = useState(null);
  const [selected, setSelected] = useState(null);

  const pizarras = match.pizarras && match.pizarras.length ? match.pizarras : [{ id: uid('pz'), nombre: 'Principal', sistema: '4-4-2', fichas: [], dibujos: [] }];
  const idx = Math.min(activeIdx, pizarras.length - 1);
  const pizarra = pizarras[idx];
  const titulares = match.convocatoria.titulares.map(id => players.find(p => p.id === id)).filter(Boolean);
  const suplentes = match.convocatoria.suplentes.map(id => players.find(p => p.id === id)).filter(Boolean);

  function setPizarras(next) {
    updateMatch(setMatches, match.id, m => ({ ...m, pizarras: next }));
  }
  function updatePizarra(patch) {
    setPizarras(pizarras.map((p, i) => i === idx ? { ...p, ...patch } : p));
  }
  function addDibujo(d) { updatePizarra({ dibujos: [...pizarra.dibujos, d] }); }

  // Si cambia el once titular en la Convocatoria (se añade o se quita alguien), la pizarra
  // activa se reajusta sola: quita del campo a quien ya no sea titular y coloca a los nuevos
  // titulares en los huecos que queden libres (o en el centro si no hay hueco).
  useEffect(() => {
    const titIds = match.convocatoria.titulares;
    const titSet = new Set(titIds);
    const currentIds = new Set(pizarra.fichas.map(f => f.playerId).filter(Boolean));
    const missing = titIds.filter(id => !currentIds.has(id));
    const hasStale = pizarra.fichas.some(f => f.playerId && !titSet.has(f.playerId));
    if (!missing.length && !hasStale) return;

    const liberadas = pizarra.fichas.map(f => (f.playerId && !titSet.has(f.playerId)) ? { ...f, playerId: null } : { ...f });
    const pendientes = [...missing];
    const reconciliadas = liberadas.map(f => (!f.playerId && pendientes.length) ? { ...f, playerId: pendientes.shift() } : f);
    while (pendientes.length) reconciliadas.push({ playerId: pendientes.shift(), x: 52.5, y: 34 });
    updatePizarra({ fichas: reconciliadas.filter(f => f.playerId) });
  }, [JSON.stringify(match.convocatoria.titulares), pizarra.id]);

  function aplicarSistema(sistema) {
    const fichas = aplicarFormacion(titulares, sistema);
    updatePizarra({ sistema, fichas });
  }

  function addPizarra() {
    const np = { id: uid('pz'), nombre: 'Pizarra ' + (pizarras.length + 1), sistema: pizarra.sistema, fichas: aplicarFormacion(titulares, pizarra.sistema), dibujos: [] };
    setPizarras([...pizarras, np]);
    setActiveIdx(pizarras.length);
  }
  async function deletePizarra(i) {
    if (pizarras.length <= 1) { toast.error('Debe quedar al menos una pizarra'); return; }
    const ok = await confirm({ title: 'Eliminar pizarra', message: '¿Eliminar "' + pizarras[i].nombre + '"?', danger: true, confirmLabel: 'Eliminar' });
    if (!ok) return;
    const next = pizarras.filter((_, x) => x !== i);
    setPizarras(next);
    setActiveIdx(Math.max(0, i - 1));
  }
  function renamePizarra(i, nombre) {
    setPizarras(pizarras.map((p, x) => x === i ? { ...p, nombre } : p));
  }

  function onFichaPointerDown(e, playerId) {
    e.stopPropagation();
    setSelected(playerId);
    if (!canEdit || tool !== 'mover') return;
    e.target.setPointerCapture(e.pointerId);
    setDragId(playerId);
  }
  function onSvgPointerDown(e) {
    if (!canEdit) { return; }
    const svg = svgRef.current;
    const pt = getSvgPoint(svg, e.clientX, e.clientY);
    if (tool === 'flecha-mov' || tool === 'flecha-pase' || tool === 'zona') {
      svg.setPointerCapture(e.pointerId);
      setDrawTmp({ tipo: tool, x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y });
    } else if (tool === 'cono') {
      addDibujo({ id: uid('d'), tipo: 'cono', x: pt.x, y: pt.y });
    } else if (tool === 'texto') {
      setPendingText({ svgX: pt.x, svgY: pt.y, screenX: e.clientX, screenY: e.clientY, value: '' });
    } else {
      setSelected(null);
    }
  }
  function onSvgPointerMove(e) {
    const svg = svgRef.current;
    if (dragId) {
      const pt = getSvgPoint(svg, e.clientX, e.clientY);
      const x = clamp(pt.x, 2, 103), y = clamp(pt.y, 2, 66);
      updatePizarra({ fichas: pizarra.fichas.map(f => f.playerId === dragId ? { ...f, x, y } : f) });
    } else if (drawTmp) {
      const pt = getSvgPoint(svg, e.clientX, e.clientY);
      setDrawTmp(t => ({ ...t, x2: pt.x, y2: pt.y }));
    }
  }
  function onSvgPointerUp() {
    if (dragId) { setDragId(null); return; }
    if (drawTmp) {
      const dist = Math.hypot(drawTmp.x2 - drawTmp.x1, drawTmp.y2 - drawTmp.y1);
      if (dist > 1.5) addDibujo({ id: uid('d'), ...drawTmp });
      setDrawTmp(null);
    }
  }
  function confirmPendingText() {
    if (pendingText.value.trim()) addDibujo({ id: uid('d'), tipo: 'texto', x: pendingText.svgX, y: pendingText.svgY, texto: pendingText.value.trim() });
    setPendingText(null);
  }

  function poneEnJuego(suplente) {
    if (!selected) { toast.info('Primero selecciona un jugador en el campo'); return; }
    const conv = match.convocatoria;
    if (selected === suplente.id) return;
    const nuevosTitulares = conv.titulares.map(id => id === selected ? suplente.id : id);
    const nuevosSuplentes = conv.suplentes.map(id => id === suplente.id ? selected : id);
    updateMatch(setMatches, match.id, m => ({
      ...m,
      convocatoria: { ...conv, titulares: nuevosTitulares, suplentes: nuevosSuplentes },
      pizarras: pizarras.map((p, i) => i === idx ? { ...p, fichas: p.fichas.map(f => f.playerId === selected ? { ...f, playerId: suplente.id } : f) } : p),
    }));
    setSelected(suplente.id);
    toast.success('Cambio realizado');
  }

  async function exportPng() {
    try {
      const blob = await exportSvgToPngBlob(svgRef.current);
      await offerDownload('pizarra_' + pizarra.nombre.replace(/\s+/g, '_') + '.png', blob);
      toast.success('Pizarra exportada');
    } catch (e) {
      toast.error(e && e.message === 'sin_descargas' ? 'Las descargas no están disponibles aquí' : 'No se pudo exportar la imagen');
    }
  }

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        {pizarras.map((p, i) => (
          <div key={p.id} className="flex items-center gap-1">
            <button onClick={() => setActiveIdx(i)} className="px-3 py-1.5 rounded-lg text-sm font-medium"
              style={{ background: i === idx ? 'var(--club-red)' : 'var(--surface-2)', color: i === idx ? '#fff' : 'var(--text)' }}>
              {p.nombre}
            </button>
            {canEdit && i === idx && (
              <button className="icon-btn" onClick={() => deletePizarra(i)}><Icon name="trash" size={13} /></button>
            )}
          </div>
        ))}
        {canEdit && <button className="btn btn-ghost" onClick={addPizarra}><Icon name="plus" size={14} />Pizarra</button>}
      </div>

      {canEdit && (
        <input className="field-input max-w-xs" value={pizarra.nombre} onChange={e => renamePizarra(idx, e.target.value)} placeholder="Nombre de la pizarra" />
      )}

      <div className="flex flex-wrap items-center gap-2">
        <select className="field-input w-auto" value={pizarra.sistema} disabled={!canEdit} onChange={e => aplicarSistema(e.target.value)}>
          {SISTEMAS.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        {canEdit && TOOLS.map(t => (
          <button key={t.key} onClick={() => setTool(t.key)} className="icon-btn" title={t.label}
            style={tool === t.key ? { background: 'var(--club-red)', color: '#fff' } : {}}>
            <Icon name={t.icon} size={16} />
          </button>
        ))}
        {canEdit && <button className="icon-btn" title="Deshacer" onClick={() => updatePizarra({ dibujos: pizarra.dibujos.slice(0, -1) })}><Icon name="undo" size={16} /></button>}
        {canEdit && <button className="icon-btn" title="Borrar todo" onClick={async () => { if (await confirm({ title: 'Borrar dibujos', message: '¿Borrar todos los dibujos de esta pizarra?', danger: true, confirmLabel: 'Borrar' })) updatePizarra({ dibujos: [] }); }}><Icon name="eraser" size={16} /></button>}
        <button className="btn btn-secondary ml-auto" onClick={exportPng}><Icon name="download" size={15} />PNG</button>
      </div>

      <div className="flex flex-col lg:flex-row gap-4">
        <div className="flex-1 relative">
          <svg ref={svgRef} viewBox="0 0 105 68" className="w-full h-auto rounded-lg touch-none select-none" style={{ background: 'var(--pitch)', maxHeight: 560 }}
            onPointerDown={onSvgPointerDown} onPointerMove={onSvgPointerMove} onPointerUp={onSvgPointerUp} onPointerLeave={onSvgPointerUp}>
            <defs>
              <marker id="arrow-move" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="var(--club-red)" /></marker>
              <marker id="arrow-pass" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#1F2937" /></marker>
            </defs>
            <PitchMarkings />
            {pizarra.dibujos.map(d => <DrawingShape key={d.id} d={d} />)}
            {drawTmp && <DrawingShape d={drawTmp} />}
            {pizarra.fichas.filter(f => f.playerId).map(f => {
              const p = players.find(pl => pl.id === f.playerId);
              if (!p) return null;
              return <FichaToken key={f.playerId} x={f.x} y={f.y} dorsal={p.dorsal} nombre={p.nombre} selected={selected === p.id} onPointerDown={e => onFichaPointerDown(e, p.id)} />;
            })}
          </svg>
          {pendingText && (
            <div className="fixed z-[250] card p-2 flex gap-1 shadow-lg" style={{ left: Math.min(pendingText.screenX, window.innerWidth - 180), top: Math.min(pendingText.screenY, window.innerHeight - 60) }}>
              <input autoFocus className="field-input" style={{ width: 130 }} value={pendingText.value}
                onChange={e => setPendingText(t => ({ ...t, value: e.target.value }))}
                onKeyDown={e => { if (e.key === 'Enter') confirmPendingText(); if (e.key === 'Escape') setPendingText(null); }} />
              <button className="btn btn-primary" onClick={confirmPendingText}><Icon name="check" size={14} /></button>
            </div>
          )}
        </div>
        <div className="w-full lg:w-56 shrink-0">
          <div className="field-label mb-2">Banquillo</div>
          <div className="space-y-1.5">
            {suplentes.map(p => (
              <button key={p.id} onClick={() => poneEnJuego(p)} disabled={!canEdit} className="w-full flex items-center gap-2 card px-2.5 py-1.5 text-left hover:shadow-sm">
                <Avatar fotoKey={p.fotoKey} dorsal={p.dorsal} size={26} />
                <span className="text-sm truncate flex-1">{p.nombre}</span>
                <Icon name="refresh" size={13} className="text-muted" />
              </button>
            ))}
            {!suplentes.length && <p className="text-xs text-muted">Define la convocatoria para ver aquí a los suplentes.</p>}
          </div>
        </div>
      </div>
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function PostPartidoTab({ match, setMatches, canEdit }) {
  const { players } = useAppData();
  const pp = match.postPartido;
  const toast = useToast();
  const [nuevoGol, setNuevoGol] = useState({ playerId: '', minuto: '' });
  const convocados = match.convocatoria.convocados.map(id => players.find(p => p.id === id)).filter(Boolean);

  function setPP(patch) { updateMatch(setMatches, match.id, m => ({ ...m, postPartido: { ...m.postPartido, ...patch } })); }
  function addGol() {
    if (!nuevoGol.playerId) { toast.error('Selecciona el goleador'); return; }
    setPP({ goleadores: [...pp.goleadores, { id: uid('g'), playerId: nuevoGol.playerId, minuto: nuevoGol.minuto }] });
    setNuevoGol({ playerId: '', minuto: '' });
  }
  function removeGol(id) { setPP({ goleadores: pp.goleadores.filter(g => g.id !== id) }); }
  function setMinutos(playerId, val) { setPP({ minutos: { ...pp.minutos, [playerId]: val } }); }

  return (
    <div className="space-y-6 max-w-3xl">
      <div className="flex items-end gap-3">
        <div><label className="field-label mb-1 block">Sporting</label><input type="number" className="field-input" style={{ width: 80 }} disabled={!canEdit} value={pp.resultadoLocal} onChange={e => setPP({ resultadoLocal: e.target.value })} /></div>
        <span className="font-display text-xl pb-2">–</span>
        <div><label className="field-label mb-1 block">Rival</label><input type="number" className="field-input" style={{ width: 80 }} disabled={!canEdit} value={pp.resultadoVisitante} onChange={e => setPP({ resultadoVisitante: e.target.value })} /></div>
      </div>

      <div>
        <h3 className="font-display font-semibold text-lg mb-2">Goleadores</h3>
        <div className="space-y-1.5 mb-2">
          {pp.goleadores.map(g => {
            const p = players.find(x => x.id === g.playerId);
            return (
              <div key={g.id} className="flex items-center gap-2 surface-2 rounded-lg px-3 py-1.5 text-sm">
                <span className="flex-1">{p ? p.nombre : '—'}</span>
                <span className="tabular text-muted">{g.minuto ? g.minuto + "'" : ''}</span>
                {canEdit && <button className="icon-btn" onClick={() => removeGol(g.id)}><Icon name="x" size={14} /></button>}
              </div>
            );
          })}
        </div>
        {canEdit && (
          <div className="flex gap-2">
            <select className="field-input" value={nuevoGol.playerId} onChange={e => setNuevoGol(s => ({ ...s, playerId: e.target.value }))}>
              <option value="">Jugador…</option>
              {convocados.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
            <input className="field-input" style={{ width: 90 }} placeholder="Minuto" value={nuevoGol.minuto} onChange={e => setNuevoGol(s => ({ ...s, minuto: e.target.value }))} />
            <button className="btn btn-secondary" onClick={addGol}><Icon name="plus" size={15} /></button>
          </div>
        )}
      </div>

      <div>
        <h3 className="font-display font-semibold text-lg mb-2">Minutos jugados</h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {convocados.map(p => (
            <div key={p.id} className="flex items-center gap-2 card px-2.5 py-1.5">
              <span className="text-sm truncate flex-1">{p.nombre}</span>
              <input type="number" className="field-input" style={{ width: 60 }} disabled={!canEdit} value={pp.minutos[p.id] ?? ''} onChange={e => setMinutos(p.id, e.target.value)} />
            </div>
          ))}
        </div>
      </div>

      <TextBlock label="Valoración del partido" value={pp.valoracion} disabled={!canEdit} rows={5} onChange={v => setPP({ valoracion: v })} />
    </div>
  );
}

function buildPlanHtml(match, rival, players) {
  const p = match.plan;
  const titulares = match.convocatoria.titulares.map(id => players.find(x => x.id === id)).filter(Boolean);
  const suplentes = match.convocatoria.suplentes.map(id => players.find(x => x.id === id)).filter(Boolean);
  const esc = (s) => String(s || '—').replace(/</g, '&lt;');
  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Plan de partido</title>' +
    '<style>body{font-family:Arial,sans-serif;max-width:800px;margin:32px auto;color:#1c1c1a;line-height:1.5}' +
    'h1{color:#D2001F;margin-bottom:0}h2{border-bottom:2px solid #D2001F;padding-bottom:4px;margin-top:28px}' +
    '.meta{color:#6f6d66;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}' +
    'ul{margin:4px 0}li{margin-bottom:2px}@media print{body{margin:0}}</style></head><body>' +
    '<h1>Real Sporting de Gijón vs ' + esc(rival && rival.nombre) + '</h1>' +
    '<div class="meta">' + esc(match.competicion) + (match.jornada ? ' · Jornada ' + esc(match.jornada) : '') + ' · ' + esc(fmtFecha(match.fecha)) + ' ' + esc(match.hora) + ' · ' + esc(match.estadio) + '</div>' +
    '<h2>Análisis del rival</h2>' +
    '<p><b>Fortalezas:</b> ' + esc(p.analisisRival.fortalezas) + '</p>' +
    '<p><b>Debilidades:</b> ' + esc(p.analisisRival.debilidades) + '</p>' +
    '<p><b>Jugadores clave:</b> ' + esc(p.analisisRival.jugadoresClave) + '</p>' +
    '<h2>Fases del juego</h2><div class="grid">' +
    '<p><b>Ataque organizado:</b> ' + esc(p.fases.atqOrg) + '</p>' +
    '<p><b>Defensa organizada:</b> ' + esc(p.fases.defOrg) + '</p>' +
    '<p><b>Transición ofensiva:</b> ' + esc(p.fases.transOf) + '</p>' +
    '<p><b>Transición defensiva:</b> ' + esc(p.fases.transDef) + '</p></div>' +
    '<h2>Balón parado</h2>' +
    '<p><b>Ofensivo:</b> ' + esc(p.abp.ofensivo) + '</p><p><b>Defensivo:</b> ' + esc(p.abp.defensivo) + '</p>' +
    '<h2>Instrucciones individuales</h2><p>' + esc(p.instrucciones) + '</p>' +
    '<h2>Convocatoria</h2>' +
    '<p><b>Titulares:</b></p><ul>' + titulares.map(t => '<li>#' + t.dorsal + ' ' + esc(t.nombre) + ' (' + t.posicion + ')</li>').join('') + '</ul>' +
    '<p><b>Suplentes:</b></p><ul>' + suplentes.map(t => '<li>#' + t.dorsal + ' ' + esc(t.nombre) + '</li>').join('') + '</ul>' +
    '<h2>Notas</h2><p>' + esc(p.notas) + '</p>' +
    '</body></html>';
}
</script>
<script type="text/babel" data-presets="react">
const MATCH_TABS = [
  { key: 'plan', label: 'Plan de partido' },
  { key: 'convocatoria', label: 'Convocatoria' },
  { key: 'campograma', label: 'Campograma' },
  { key: 'post', label: 'Post-partido' },
];

function MatchDetailScreen({ match, onBack, onDelete, canEdit, canDelete }) {
  const { teams, players, setMatches } = useAppData();
  const toast = useToast();
  const [tab, setTab] = useState('plan');
  const rival = teams.find(t => t.id === match.rivalId);

  async function exportInforme() {
    try {
      const html = buildPlanHtml(match, rival, players);
      await offerDownload('plan_partido_' + (rival ? rival.nombre.replace(/\s+/g, '_') : 'rival') + '.html', html);
      toast.success('Informe exportado. Ábrelo en el navegador para imprimirlo.');
    } catch (e) {
      toast.error(e && e.message === 'sin_descargas' ? 'Las descargas no están disponibles aquí' : 'No se pudo exportar el informe');
    }
  }

  return (
    <div className="p-4 md:p-6 max-w-6xl mx-auto space-y-4">
      <div className="flex items-center gap-2">
        <button className="icon-btn" onClick={onBack}><Icon name="chevronLeft" /></button>
        <div className="flex-1 min-w-0">
          <h1 className="font-display text-xl font-bold truncate">
            {match.condicion === 'visitante' ? (rival ? rival.nombre : 'Rival') + ' vs Sporting' : 'Sporting vs ' + (rival ? rival.nombre : 'Rival')}
          </h1>
          <p className="text-xs text-muted">{fmtFecha(match.fecha)} · {match.hora} · {match.estadio || '—'}</p>
        </div>
        <button className="btn btn-secondary" onClick={exportInforme}><Icon name="download" size={15} /><span className="hidden sm:inline">Exportar informe</span></button>
        {canDelete && <button className="btn btn-danger" onClick={onDelete}><Icon name="trash" size={15} /></button>}
      </div>

      <div className="flex gap-1 surface-2 rounded-lg p-1 w-fit scrollx max-w-full">
        {MATCH_TABS.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} className="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap"
            style={{ background: tab === t.key ? 'var(--club-red)' : 'transparent', color: tab === t.key ? '#fff' : 'var(--text)' }}>
            {t.label}
          </button>
        ))}
      </div>

      <div>
        {tab === 'plan' && <PlanTab match={match} setMatches={setMatches} canEdit={canEdit} />}
        {tab === 'convocatoria' && <ConvocatoriaTab match={match} setMatches={setMatches} canEdit={canEdit} />}
        {tab === 'campograma' && <CampogramaTab match={match} setMatches={setMatches} canEdit={canEdit} />}
        {tab === 'post' && <PostPartidoTab match={match} setMatches={setMatches} canEdit={canEdit} />}
      </div>
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function VideoCard({ video, rival, onClick }) {
  const info = parseVideoUrl(video.url);
  return (
    <button onClick={onClick} className="card p-4 text-left hover:shadow-md transition-shadow w-full">
      <div className="flex items-start gap-3">
        <div className="w-16 h-12 rounded-lg flex items-center justify-center shrink-0" style={{ background: 'var(--club-dark)' }}>
          <Icon name="play" size={18} style={{ color: '#fff' }} />
        </div>
        <div className="min-w-0 flex-1">
          <div className="font-semibold truncate">{video.titulo}</div>
          <div className="text-xs text-muted truncate">{rival ? rival.nombre : ''} {video.fecha ? '· ' + fmtFecha(video.fecha) : ''}</div>
          <div className="flex flex-wrap gap-1 mt-1.5">
            {(video.etiquetas || []).slice(0, 3).map(t => <span key={t} className="badge" style={{ background: 'var(--surface-2)', color: 'var(--text-muted)' }}>{t}</span>)}
            {video.clips && video.clips.length > 0 && <span className="badge" style={{ background: 'var(--info-bg)', color: 'var(--info)' }}>{video.clips.length} clips</span>}
          </div>
        </div>
      </div>
    </button>
  );
}

function VideotecaScreen() {
  const { videos, setVideos, matches, teams, players, canDo, pushActivity } = useAppData();
  const toast = useToast();
  const confirm = useConfirm();
  const [query, setQuery] = useState('');
  const [filtroMatch, setFiltroMatch] = useState('');
  const [filtroJugador, setFiltroJugador] = useState('');
  const [filtroTag, setFiltroTag] = useState('');
  const [editing, setEditing] = useState(undefined);
  const [detail, setDetail] = useState(null);
  const [tabView, setTabView] = useState('videos');

  const canEdit = canDo('videoteca', 'editar');
  const canDelete = canDo('videoteca', 'eliminar');
  const items = videos.items || [];
  const allTags = [...new Set(items.flatMap(v => v.etiquetas || []))];

  const filtered = items.filter(v => {
    if (filtroMatch && v.matchId !== filtroMatch) return false;
    if (filtroJugador && !(v.jugadores || []).includes(filtroJugador)) return false;
    if (filtroTag && !(v.etiquetas || []).includes(filtroTag)) return false;
    if (query && !v.titulo.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  function videoFormFields() {
    return [
      { name: 'titulo', label: 'Título', required: true },
      { name: 'url', label: 'Enlace (YouTube, Vimeo o Drive)', required: true, placeholder: 'https://…' },
      { name: 'descripcion', label: 'Descripción', type: 'textarea' },
      { name: 'fecha', label: 'Fecha', type: 'date' },
      { name: 'etiquetas', label: 'Etiquetas (separadas por comas)' },
      { name: 'matchId', label: 'Partido relacionado', type: 'select', options: matches.map(m => ({ value: m.id, label: fmtFecha(m.fecha) + ' vs ' + ((teams.find(t => t.id === m.rivalId) || {}).nombre || 'Rival') })) },
      { name: 'rivalId', label: 'Rival relacionado', type: 'select', options: teams.map(t => ({ value: t.id, label: t.nombre })) },
    ];
  }

  function saveVideo(values) {
    const etiquetas = String(values.etiquetas || '').split(',').map(s => s.trim()).filter(Boolean);
    if (editing && editing.id) {
      setVideos(v => ({ ...v, items: v.items.map(x => x.id === editing.id ? { ...x, ...values, etiquetas } : x) }));
      pushActivity('Editó vídeo', values.titulo);
    } else {
      const nv = { id: uid('v'), jugadores: [], clips: [], ...values, etiquetas };
      setVideos(v => ({ ...v, items: [...v.items, nv] }));
      pushActivity('Añadió vídeo', values.titulo);
    }
    toast.success('Guardado');
    setEditing(undefined);
  }

  async function removeVideo(v) {
    const ok = await confirm({ title: 'Eliminar vídeo', message: '¿Eliminar "' + v.titulo + '"?', danger: true, confirmLabel: 'Eliminar' });
    if (!ok) return;
    setVideos(s => ({ ...s, items: s.items.filter(x => x.id !== v.id), playlists: s.playlists.map(pl => ({ ...pl, videoIds: pl.videoIds.filter(id => id !== v.id) })) }));
    toast.success('Eliminado');
    setDetail(null);
  }

  function updateVideo(id, patch) {
    setVideos(v => ({ ...v, items: v.items.map(x => x.id === id ? { ...x, ...patch } : x) }));
    setDetail(d => d && d.id === id ? { ...d, ...patch } : d);
  }

  return (
    <div className="p-4 md:p-6 max-w-6xl mx-auto space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="font-display text-2xl font-bold">Videoteca</h1>
        {canEdit && tabView === 'videos' && <button className="btn btn-primary" onClick={() => setEditing(null)}><Icon name="plus" size={16} />Añadir vídeo</button>}
      </div>
      <div className="flex gap-1 surface-2 rounded-lg p-1 w-fit">
        <button onClick={() => setTabView('videos')} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: tabView === 'videos' ? 'var(--club-red)' : 'transparent', color: tabView === 'videos' ? '#fff' : 'var(--text)' }}>Vídeos</button>
        <button onClick={() => setTabView('playlists')} className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: tabView === 'playlists' ? 'var(--club-red)' : 'transparent', color: tabView === 'playlists' ? '#fff' : 'var(--text)' }}>Listas de reproducción</button>
      </div>

      {tabView === 'videos' ? (
        <React.Fragment>
          <div className="flex flex-wrap gap-3">
            <div className="w-full sm:w-56"><SearchInput value={query} onChange={setQuery} placeholder="Buscar vídeo…" /></div>
            <select className="field-input w-auto" value={filtroMatch} onChange={e => setFiltroMatch(e.target.value)}>
              <option value="">Todos los partidos</option>
              {matches.map(m => <option key={m.id} value={m.id}>{fmtFecha(m.fecha)} vs {(teams.find(t => t.id === m.rivalId) || {}).nombre}</option>)}
            </select>
            <select className="field-input w-auto" value={filtroJugador} onChange={e => setFiltroJugador(e.target.value)}>
              <option value="">Todos los jugadores</option>
              {players.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
            <select className="field-input w-auto" value={filtroTag} onChange={e => setFiltroTag(e.target.value)}>
              <option value="">Todas las etiquetas</option>
              {allTags.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {filtered.map(v => <VideoCard key={v.id} video={v} rival={teams.find(t => t.id === v.rivalId)} onClick={() => setDetail(v)} />)}
            {!filtered.length && <EmptyState icon="video" text="No hay vídeos que coincidan con los filtros." />}
          </div>
        </React.Fragment>
      ) : (
        <PlaylistsPanel videos={videos} setVideos={setVideos} canEdit={canEdit} onOpenVideo={setDetail} />
      )}

      {detail && (
        <VideoDetailModal video={detail} rival={teams.find(t => t.id === detail.rivalId)} match={matches.find(m => m.id === detail.matchId)}
          players={players} canEdit={canEdit} canDelete={canDelete}
          onClose={() => setDetail(null)} onEdit={() => setEditing(detail)} onDelete={() => removeVideo(detail)}
          onUpdate={(patch) => updateVideo(detail.id, patch)} />
      )}

      {editing !== undefined && (
        <EntityFormModal title={editing ? 'Editar vídeo' : 'Nuevo vídeo'} fields={videoFormFields()}
          initial={editing ? { ...editing, etiquetas: (editing.etiquetas || []).join(', ') } : {}}
          onSubmit={saveVideo} onClose={() => setEditing(undefined)} wide />
      )}
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function VideoDetailModal({ video, rival, match, players, canEdit, canDelete, onClose, onEdit, onDelete, onUpdate }) {
  const toast = useToast();
  const [nuevoClip, setNuevoClip] = useState({ inicio: '', fin: '', categoria: 'gol', nota: '' });
  const jugadoresVinculados = (video.jugadores || []).map(id => players.find(p => p.id === id)).filter(Boolean);

  function addClip() {
    if (!nuevoClip.inicio) { toast.error('Indica el minuto de inicio (mm:ss)'); return; }
    const clip = { id: uid('c'), inicio: parseMmss(nuevoClip.inicio), fin: nuevoClip.fin ? parseMmss(nuevoClip.fin) : null, categoria: nuevoClip.categoria, nota: nuevoClip.nota };
    onUpdate({ clips: [...(video.clips || []), clip] });
    setNuevoClip({ inicio: '', fin: '', categoria: 'gol', nota: '' });
  }
  function removeClip(id) { onUpdate({ clips: (video.clips || []).filter(c => c.id !== id) }); }
  function toggleJugador(id) {
    const cur = video.jugadores || [];
    onUpdate({ jugadores: cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id] });
  }

  return (
    <Modal title={video.titulo} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex flex-wrap items-center gap-2 text-sm text-muted">
          {rival && <span>{rival.nombre}</span>}
          {video.fecha && <span>· {fmtFecha(video.fecha)}</span>}
          {match && <span>· J{match.jornada}</span>}
        </div>
        {video.descripcion && <p className="text-sm">{video.descripcion}</p>}
        <a href={video.url} target="_blank" rel="noopener" className="btn btn-primary w-fit"><Icon name="externalLink" size={15} />Abrir vídeo original</a>

        <div>
          <div className="field-label mb-2">Clips</div>
          <div className="space-y-1.5 mb-2">
            {(video.clips || []).map(c => (
              <div key={c.id} className="flex items-center gap-2 surface-2 rounded-lg px-3 py-1.5 text-sm">
                <span className="badge" style={{ background: 'var(--info-bg)', color: 'var(--info)' }}>{(CATEGORIAS_CLIP.find(x => x.key === c.categoria) || {}).label}</span>
                <span className="tabular">{mmss(c.inicio)}{c.fin ? ' – ' + mmss(c.fin) : ''}</span>
                <span className="flex-1 truncate text-muted">{c.nota}</span>
                <a href={buildTimestampUrl(video.url, c.inicio)} target="_blank" rel="noopener" className="icon-btn" title="Ver clip"><Icon name="play" size={14} /></a>
                {canEdit && <button className="icon-btn" onClick={() => removeClip(c.id)}><Icon name="x" size={14} /></button>}
              </div>
            ))}
            {!(video.clips || []).length && <p className="text-sm text-muted">Sin clips todavía.</p>}
          </div>
          {canEdit && (
            <div className="flex flex-wrap gap-2">
              <input className="field-input" style={{ width: 90 }} placeholder="mm:ss" value={nuevoClip.inicio} onChange={e => setNuevoClip(s => ({ ...s, inicio: e.target.value }))} />
              <input className="field-input" style={{ width: 90 }} placeholder="fin (opc.)" value={nuevoClip.fin} onChange={e => setNuevoClip(s => ({ ...s, fin: e.target.value }))} />
              <select className="field-input" style={{ width: 150 }} value={nuevoClip.categoria} onChange={e => setNuevoClip(s => ({ ...s, categoria: e.target.value }))}>
                {CATEGORIAS_CLIP.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
              </select>
              <input className="field-input flex-1" placeholder="Nota" value={nuevoClip.nota} onChange={e => setNuevoClip(s => ({ ...s, nota: e.target.value }))} />
              <button className="btn btn-secondary" onClick={addClip}><Icon name="plus" size={15} /></button>
            </div>
          )}
        </div>

        <div>
          <div className="field-label mb-2">Jugadores vinculados</div>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {jugadoresVinculados.map(p => <span key={p.id} className="badge" style={{ background: 'var(--surface-2)' }}>{p.nombre}</span>)}
            {!jugadoresVinculados.length && <span className="text-sm text-muted">Ninguno</span>}
          </div>
          {canEdit && (
            <details>
              <summary className="text-sm cursor-pointer" style={{ color: 'var(--info)' }}>Editar jugadores vinculados</summary>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 mt-2 max-h-40 overflow-y-auto">
                {players.map(p => (
                  <label key={p.id} className="flex items-center gap-1.5 text-sm">
                    <input type="checkbox" checked={(video.jugadores || []).includes(p.id)} onChange={() => toggleJugador(p.id)} />
                    {p.nombre}
                  </label>
                ))}
              </div>
            </details>
          )}
        </div>

        <div className="flex justify-end gap-2 pt-3 border-t" style={{ borderColor: 'var(--border)' }}>
          {canDelete && <button className="btn btn-danger" onClick={onDelete}><Icon name="trash" size={15} />Eliminar</button>}
          {canEdit && <button className="btn btn-primary" onClick={onEdit}><Icon name="edit" size={15} />Editar</button>}
        </div>
      </div>
    </Modal>
  );
}

function PlaylistsPanel({ videos, setVideos, canEdit, onOpenVideo }) {
  const toast = useToast();
  const [nombre, setNombre] = useState('');
  const [openId, setOpenId] = useState(null);
  const playlists = videos.playlists || [];

  function crearPlaylist() {
    if (!nombre.trim()) { toast.error('Ponle un nombre a la lista'); return; }
    setVideos(v => ({ ...v, playlists: [...v.playlists, { id: uid('pl'), nombre: nombre.trim(), videoIds: [] }] }));
    setNombre('');
  }
  function eliminarPlaylist(id) { setVideos(v => ({ ...v, playlists: v.playlists.filter(p => p.id !== id) })); }
  function toggleVideoInPlaylist(plId, videoId) {
    setVideos(v => ({
      ...v, playlists: v.playlists.map(p => p.id !== plId ? p : {
        ...p, videoIds: p.videoIds.includes(videoId) ? p.videoIds.filter(x => x !== videoId) : [...p.videoIds, videoId],
      }),
    }));
  }

  return (
    <div className="space-y-4">
      {canEdit && (
        <div className="flex gap-2 max-w-md">
          <input className="field-input" placeholder='Ej. "Análisis rival jornada 7"' value={nombre} onChange={e => setNombre(e.target.value)} />
          <button className="btn btn-primary" onClick={crearPlaylist}><Icon name="plus" size={15} />Crear</button>
        </div>
      )}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        {playlists.map(pl => (
          <div key={pl.id} className="card p-4">
            <div className="flex items-center justify-between mb-2">
              <span className="font-semibold">{pl.nombre}</span>
              <div className="flex items-center gap-1">
                <button className="icon-btn" onClick={() => setOpenId(openId === pl.id ? null : pl.id)}><Icon name={openId === pl.id ? 'chevronDown' : 'chevronRight'} size={15} /></button>
                {canEdit && <button className="icon-btn" onClick={() => eliminarPlaylist(pl.id)}><Icon name="trash" size={15} /></button>}
              </div>
            </div>
            <div className="text-xs text-muted mb-2">{pl.videoIds.length} vídeos</div>
            {openId === pl.id && (
              <div className="space-y-1 max-h-56 overflow-y-auto">
                {(videos.items || []).map(v => (
                  <label key={v.id} className="flex items-center gap-2 text-sm">
                    <input type="checkbox" checked={pl.videoIds.includes(v.id)} disabled={!canEdit} onChange={() => toggleVideoInPlaylist(pl.id, v.id)} />
                    <button onClick={() => onOpenVideo(v)} className="hover:underline text-left flex-1 truncate">{v.titulo}</button>
                  </label>
                ))}
              </div>
            )}
          </div>
        ))}
        {!playlists.length && <EmptyState icon="video" text="Crea tu primera lista de reproducción." />}
      </div>
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function UsuariosScreen() {
  const { users, setUsers, settings, setSettings, activity, currentUser, canDo, pushActivity } = useAppData();
  const toast = useToast();
  const confirm = useConfirm();
  const [editing, setEditing] = useState(undefined);
  const [tabView, setTabView] = useState('usuarios');

  const canEdit = canDo('usuarios', 'editar');
  const canDelete = canDo('usuarios', 'eliminar');
  const isAdmin = currentUser.rol === 'Administrador';

  function userFormFields(isNew) {
    const f = [
      { name: 'usuario', label: 'Usuario', required: true },
      { name: 'rol', label: 'Rol', type: 'select', required: true, options: ROLES.map(r => ({ value: r, label: r })) },
      { name: 'password', label: isNew ? 'Contraseña' : 'Nueva contraseña (opcional)', type: 'password', required: isNew },
    ];
    return f;
  }

  async function saveUser(values) {
    const usuarioLower = values.usuario.trim().toLowerCase();
    const dup = users.some(u => u.usuario.toLowerCase() === usuarioLower && u.id !== (editing && editing.id));
    if (dup) { toast.error('Ya existe un usuario con ese nombre'); return; }
    if (editing && editing.id) {
      let passwordHash = editing.passwordHash;
      if (values.password) passwordHash = await sha256(values.password);
      setUsers(list => list.map(u => u.id === editing.id ? { ...u, usuario: values.usuario, rol: values.rol, passwordHash } : u));
      pushActivity('Editó usuario', values.usuario);
    } else {
      const passwordHash = await sha256(values.password);
      setUsers(list => [...list, { id: uid('u'), usuario: values.usuario, rol: values.rol, passwordHash, activo: true }]);
      pushActivity('Creó usuario', values.usuario);
    }
    toast.success('Guardado');
    setEditing(undefined);
  }

  function toggleActivo(u) {
    if (u.id === currentUser.id) { toast.error('No puedes desactivar tu propia cuenta'); return; }
    setUsers(list => list.map(x => x.id === u.id ? { ...x, activo: x.activo === false } : x));
    pushActivity(u.activo === false ? 'Activó usuario' : 'Desactivó usuario', u.usuario);
  }

  async function removeUser(u) {
    if (u.id === currentUser.id) { toast.error('No puedes eliminar tu propia cuenta'); return; }
    const ok = await confirm({ title: 'Eliminar usuario', message: '¿Eliminar a ' + u.usuario + '?', danger: true, confirmLabel: 'Eliminar' });
    if (!ok) return;
    setUsers(list => list.filter(x => x.id !== u.id));
    pushActivity('Eliminó usuario', u.usuario);
  }

  function setPermiso(rol, modulo, nivel) {
    setSettings(s => ({ ...s, permissions: { ...s.permissions, [rol]: { ...s.permissions[rol], [modulo]: nivel } } }));
  }

  return (
    <div className="p-4 md:p-6 max-w-5xl mx-auto space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="font-display text-2xl font-bold">Usuarios</h1>
        {canEdit && tabView === 'usuarios' && <button className="btn btn-primary" onClick={() => setEditing(null)}><Icon name="plus" size={16} />Añadir usuario</button>}
      </div>
      <div className="flex gap-1 surface-2 rounded-lg p-1 w-fit scrollx max-w-full">
        <button onClick={() => setTabView('usuarios')} className="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style={{ background: tabView === 'usuarios' ? 'var(--club-red)' : 'transparent', color: tabView === 'usuarios' ? '#fff' : 'var(--text)' }}>Usuarios</button>
        {isAdmin && <button onClick={() => setTabView('permisos')} className="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style={{ background: tabView === 'permisos' ? 'var(--club-red)' : 'transparent', color: tabView === 'permisos' ? '#fff' : 'var(--text)' }}>Permisos</button>}
        <button onClick={() => setTabView('actividad')} className="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style={{ background: tabView === 'actividad' ? 'var(--club-red)' : 'transparent', color: tabView === 'actividad' ? '#fff' : 'var(--text)' }}>Actividad</button>
      </div>

      {tabView === 'usuarios' && (
        <div className="space-y-2">
          {users.map(u => (
            <div key={u.id} className="card p-3 flex items-center gap-3">
              <Avatar size={40} />
              <div className="min-w-0 flex-1">
                <div className="font-semibold truncate flex items-center gap-2">{u.usuario} {u.id === currentUser.id && <span className="badge" style={{ background: 'var(--info-bg)', color: 'var(--info)' }}>Tú</span>}</div>
                <div className="text-xs text-muted">{u.rol}</div>
              </div>
              <span className="badge" style={{ background: u.activo === false ? 'var(--danger-bg)' : 'var(--ok-bg)', color: u.activo === false ? 'var(--danger)' : 'var(--ok)' }}>{u.activo === false ? 'Desactivado' : 'Activo'}</span>
              {canEdit && <button className="icon-btn" onClick={() => toggleActivo(u)} title="Activar/desactivar"><Icon name={u.activo === false ? 'check' : 'x'} size={15} /></button>}
              {canEdit && <button className="icon-btn" onClick={() => setEditing(u)}><Icon name="edit" size={15} /></button>}
              {canDelete && <button className="icon-btn" onClick={() => removeUser(u)}><Icon name="trash" size={15} /></button>}
            </div>
          ))}
        </div>
      )}

      {tabView === 'permisos' && isAdmin && (
        <div className="scrollx">
          <table className="w-full text-sm border-collapse min-w-[640px]">
            <thead>
              <tr>
                <th className="text-left p-2 field-label">Rol</th>
                {MODULES.map(m => <th key={m.key} className="text-left p-2 field-label">{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {ROLES.map(rol => (
                <tr key={rol} className="border-t" style={{ borderColor: 'var(--border)' }}>
                  <td className="p-2 font-medium">{rol}</td>
                  {MODULES.map(m => (
                    <td key={m.key} className="p-2">
                      {rol === 'Administrador' ? <span className="text-xs text-muted">Eliminar</span> : (
                        <select className="field-input" value={(settings.permissions[rol] || {})[m.key] || 'sin_acceso'} onChange={e => setPermiso(rol, m.key, e.target.value)}>
                          {PERM_LEVELS.map(l => <option key={l} value={l}>{PERM_LABEL[l]}</option>)}
                        </select>
                      )}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tabView === 'actividad' && (
        <div className="space-y-1.5 max-h-[70vh] overflow-y-auto">
          {activity.map((a, i) => (
            <div key={i} className="flex items-center gap-3 text-sm px-3 py-2 surface-2 rounded-lg">
              <span className="text-xs text-muted tabular w-36 shrink-0">{new Date(a.ts).toLocaleString('es-ES')}</span>
              <span className="font-medium">{a.usuario}</span>
              <span className="text-muted">{a.accion}</span>
              <span className="truncate">{a.detalle}</span>
            </div>
          ))}
          {!activity.length && <EmptyState icon="clock" text="Todavía no hay actividad registrada." />}
        </div>
      )}

      {editing !== undefined && (
        <EntityFormModal title={editing ? 'Editar usuario' : 'Nuevo usuario'} fields={userFormFields(!editing)}
          initial={editing ? { usuario: editing.usuario, rol: editing.rol } : { rol: 'Entrenador' }}
          onSubmit={saveUser} onClose={() => setEditing(undefined)} />
      )}
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function AjustesScreen() {
  const { players, staff, teams, matches, videos, users, settings, activity,
    setPlayers, setStaff, setTeams, setMatches, setVideos, setSettings, canDo, pushActivity } = useAppData();
  const toast = useToast();
  const confirm = useConfirm();
  const fileRef = useRef(null);
  const canEdit = canDo('ajustes', 'editar');

  async function exportarCopia() {
    const payload = { version: 1, exportadoEl: new Date().toISOString(), players, staff, teams, matches, videos, settings, activity };
    try {
      await offerDownload('sporting_copia_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(payload, null, 2));
      toast.success('Copia exportada');
      pushActivity('Exportó copia de seguridad');
    } catch (e) {
      toast.error(e && e.message === 'sin_descargas' ? 'Las descargas no están disponibles aquí' : 'No se pudo exportar la copia');
    }
  }

  function importarCopia(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        const ok = await confirm({ title: 'Importar copia', message: 'Esto sobrescribirá los datos actuales de plantilla, equipos, partidos, vídeos y ajustes. ¿Continuar?', danger: true, confirmLabel: 'Importar' });
        if (!ok) return;
        if (data.players) setPlayers(data.players);
        if (data.staff) setStaff(data.staff);
        if (data.teams) setTeams(data.teams);
        if (data.matches) setMatches(data.matches);
        if (data.videos) setVideos(data.videos);
        if (data.settings) setSettings(data.settings);
        pushActivity('Importó copia de seguridad');
        toast.success('Copia importada correctamente');
      } catch (err) {
        toast.error('El archivo no es una copia válida');
      }
    };
    reader.readAsText(file);
  }

  async function restablecer() {
    const ok = await confirm({ title: 'Restablecer datos de ejemplo', message: 'Se sustituirán la plantilla, el cuerpo técnico, los equipos, los partidos y los vídeos por los datos de ejemplo. Los usuarios no se verán afectados. Esta acción no se puede deshacer.', danger: true, confirmLabel: 'Restablecer' });
    if (!ok) return;
    setPlayers(SEED_PLAYERS);
    setStaff(SEED_STAFF);
    setTeams(SEED_TEAMS);
    setMatches(seedMatch(SEED_TEAMS, SEED_PLAYERS));
    setVideos(SEED_VIDEOS);
    setSettings(s => ({ ...s, permissions: defaultPermissions() }));
    pushActivity('Restableció datos de ejemplo');
    toast.success('Datos restablecidos');
  }

  return (
    <div className="p-4 md:p-6 max-w-3xl mx-auto space-y-6">
      <h1 className="font-display text-2xl font-bold">Ajustes</h1>

      <div className="card p-4">
        <h2 className="font-display font-semibold text-lg mb-1">Datos del club</h2>
        <div className="grid sm:grid-cols-2 gap-3 mt-2">
          <FieldInput field={{ name: 'nombre', label: 'Nombre del club' }} value={settings.clubInfo && settings.clubInfo.nombre}
            onChange={v => setSettings(s => ({ ...s, clubInfo: { ...s.clubInfo, nombre: v } }))} />
          <FieldInput field={{ name: 'temporada', label: 'Temporada' }} value={settings.clubInfo && settings.clubInfo.temporada}
            onChange={v => setSettings(s => ({ ...s, clubInfo: { ...s.clubInfo, temporada: v } }))} />
        </div>
      </div>

      <div className="card p-4 space-y-3">
        <h2 className="font-display font-semibold text-lg">Copia de seguridad</h2>
        <p className="text-sm text-muted">Guarda o restaura toda la información de la aplicación en un archivo JSON.</p>
        <div className="flex flex-wrap gap-2">
          <button className="btn btn-secondary" onClick={exportarCopia}><Icon name="download" size={15} />Exportar copia (JSON)</button>
          {canEdit && <button className="btn btn-secondary" onClick={() => fileRef.current.click()}><Icon name="upload" size={15} />Importar copia</button>}
          <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={importarCopia} />
        </div>
      </div>

      {canEdit && (
        <div className="card p-4 space-y-3" style={{ borderColor: 'var(--danger)' }}>
          <h2 className="font-display font-semibold text-lg" style={{ color: 'var(--danger)' }}>Zona de riesgo</h2>
          <p className="text-sm text-muted">Restablece la plantilla, los equipos, los partidos y los vídeos a los datos de ejemplo iniciales.</p>
          <button className="btn btn-danger w-fit" onClick={restablecer}><Icon name="refresh" size={15} />Restablecer datos de ejemplo</button>
        </div>
      )}
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
function LoadingScreen() {
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-3" style={{ background: 'var(--bg)' }}>
      <div style={{ width: 44, height: 44, borderRadius: 999, border: '4px solid var(--border)', borderTopColor: 'var(--club-red)', animation: 'spin 0.8s linear infinite' }} />
      <div className="text-sm text-muted">Cargando Sporting Banquillo…</div>
    </div>
  );
}

function AppShell() {
  const { loading, loadError, currentUser } = useAppData();
  if (loading) return <LoadingScreen />;
  if (loadError) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ background: 'var(--bg)' }}>
        <div className="card p-6 max-w-sm text-center">
          <Icon name="alertTriangle" size={28} style={{ color: 'var(--danger)' }} className="mx-auto mb-2" />
          <p className="text-sm">No se pudo conectar con el almacenamiento. Comprueba tu conexión y recarga la página.</p>
        </div>
      </div>
    );
  }
  if (!currentUser) return <AuthScreen />;
  return <MainLayout />;
}

function App() {
  return (
    <ToastProvider>
      <ConfirmProvider>
        <PhotoProvider>
          <AppDataProvider>
            <AppShell />
          </AppDataProvider>
        </PhotoProvider>
      </ConfirmProvider>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
