function posicionALinea(pos) {
  const p = (pos || '').toUpperCase();
  if (p === 'POR') return 'POR';
  if (['LD', 'LI', 'DFC', 'LAT', 'CAR'].includes(p)) return 'DEF';
  if (['MC', 'MCO', 'MCD', 'MI', 'MD'].includes(p)) return 'MED';
  if (['EI', 'ED', 'DC', 'SD'].includes(p)) return 'DEL';
  return 'SIN';
}

function uid(prefix) {
  return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function fmtFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}

function calcularEdad(iso) {
  if (!iso) return null;
  const nacimiento = new Date(iso + 'T00:00:00');
  if (isNaN(nacimiento)) return null;
  const hoy = new Date();
  let edad = hoy.getFullYear() - nacimiento.getFullYear();
  const m = hoy.getMonth() - nacimiento.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) edad--;
  return edad;
}

function mmss(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

function parseMmss(text) {
  if (typeof text === 'number') return text;
  const t = String(text || '0').trim();
  if (t.includes(':')) {
    const [m, s] = t.split(':').map(Number);
    return (m || 0) * 60 + (s || 0);
  }
  return Number(t) || 0;
}

    { line: 'DEL', x: 38, y: 10 }, { line: 'DEL', x: 67, y: 10 },
  ],
  '3-4-3': [
    { line: 'POR', x: 52.5, y: 62 },
    { line: 'DEF', x: 20, y: 54 }, { line: 'DEF', x: 52.5, y: 58 }, { line: 'DEF', x: 85, y: 54 },
    { line: 'MED', x: 15, y: 32 }, { line: 'MED', x: 40, y: 30 }, { line: 'MED', x: 65, y: 30 }, { line: 'MED', x: 90, y: 32 },
    { line: 'DEL', x: 15, y: 10 }, { line: 'DEL', x: 52.5, y: 8 }, { line: 'DEL', x: 90, y: 10 },
  ],
  '5-3-2': [
    { line: 'POR', x: 52.5, y: 62 },
    { line: 'DEF', x: 6, y: 50 }, { line: 'DEF', x: 28, y: 55 }, { line: 'DEF', x: 52.5, y: 58 }, { line: 'DEF', x: 77, y: 55 }, { line: 'DEF', x: 99, y: 50 },
    { line: 'MED', x: 30, y: 30 }, { line: 'MED', x: 52.5, y: 32 }, { line: 'MED', x: 75, y: 30 },
    { line: 'DEL', x: 38, y: 10 }, { line: 'DEL', x: 67, y: 10 },
  ],
};
// FORMATIONS_RAW se definió pensando en un campo en vertical (portero abajo, ataque hacia
// arriba). El SVG del campograma es horizontal (porterías a izquierda/derecha), así que aquí
// rotamos esas coordenadas para que el ataque vaya siempre de izquierda (portero, x=0) a
// derecha (delanteros, x=105), manteniendo el reparto lateral de cada línea.
function orientarParaCampoHorizontal(x, y) {
  return { x: 105 - y * (105 / 68), y: x * (68 / 105) };
}
const FORMATIONS = Object.fromEntries(Object.entries(FORMATIONS_RAW).map(([sistema, slots]) =>
  [sistema, slots.map(s => ({ line: s.line, ...orientarParaCampoHorizontal(s.x, s.y) }))]
));
const SISTEMAS = Object.keys(FORMATIONS).concat(['Libre']);

function aplicarFormacion(titulares, sistema) {
  if (!FORMATIONS[sistema]) {
    return titulares.map((p, i) => ({ playerId: p.id, x: 12 + (i % 6) * 15, y: 14 + Math.floor(i / 6) * 20 }));
  }
  const tpl = FORMATIONS[sistema];
  const bucket = { POR: [], DEF: [], MED: [], DEL: [], SIN: [] };
  titulares.forEach(p => bucket[posicionALinea(p.posicion)].push(p));
  const pool = [...bucket.POR, ...bucket.DEF, ...bucket.MED, ...bucket.DEL, ...bucket.SIN];
  const bySlotLine = { POR: [], DEF: [], MED: [], DEL: [] };
  tpl.forEach((slot, i) => bySlotLine[slot.line].push(i));
  const fichas = Array.from({ length: tpl.length });
  const used = new Set();
  ['POR', 'DEF', 'MED', 'DEL'].forEach(line => {
    const players = bucket[line].filter(p => !used.has(p.id));
    const slots = bySlotLine[line];
    slots.forEach((slotIdx, i) => {
      const p = players[i];
      if (p) { used.add(p.id); fichas[slotIdx] = { playerId: p.id, x: tpl[slotIdx].x, y: tpl[slotIdx].y }; }
    });
  });
  const leftovers = pool.filter(p => !used.has(p.id));
  fichas.forEach((f, i) => {
    if (!f) {
      const p = leftovers.shift();
      fichas[i] = p ? { playerId: p.id, x: tpl[i].x, y: tpl[i].y } : { playerId: null, x: tpl[i].x, y: tpl[i].y };
    }
  });
  return fichas.filter(Boolean);
}

<script>
let __dbApi = null;

let __capabilitiesReady = null;

function initCapabilities() {
  if (__capabilitiesReady) return __capabilitiesReady;
  __capabilitiesReady = (async () => {
    try {
      if (window.claude && window.claude.use) {
        __dbApi = await window.claude.use('db');
        __downloadsApi = await window.claude.use('downloads');

    return { db: __dbApi, downloads: __downloadsApi };
  })();
  return __capabilitiesReady;
}

const LOCAL_STORAGE_PREFIX = 'sportingBanquillo:store:';

async function storageGet(key) {
  await initCapabilities();
  if (!__dbApi) {
    const raw = localStorage.getItem(LOCAL_STORAGE_PREFIX + key);
    if (raw === null) throw new Error('not_found:' + key);
    return JSON.parse(raw);
  }
  const snap = await __dbApi.doc('store/' + key).get();
  if (!snap.exists) throw new Error('not_found:' + key);
  const raw = snap.data().value;
  return JSON.parse(raw);
}

async function storageSet(key, value) {
  await initCapabilities();
  if (!__dbApi) {
    localStorage.setItem(LOCAL_STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  }
  await __dbApi.doc('store/' + key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
  return true;
}

async function storageDelete(key) {
  await initCapabilities();
  if (!__dbApi) {
    localStorage.removeItem(LOCAL_STORAGE_PREFIX + key);
    return true;
  }
  await __dbApi.doc('store/' + key).delete();
  return true;
}

async function storageList() {
  await initCapabilities();
  if (!__dbApi) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LOCAL_STORAGE_PREFIX)) keys.push(k.slice(LOCAL_STORAGE_PREFIX.length));
    }
    return keys;
  }
  const snap = await __dbApi.collection('store').get();
  return snap.docs.map(d => d.id);
}

// Repara texto guardado previamente con doble codificación UTF-8 (p.ej. "RubÃ©n" -> "Rubén"),
// causado por versiones antiguas que leían/escribían los datos con una codificación equivocada.
function fixMojibakeString(str) {
  if (typeof str !== 'string' || !/[ÃÂ]/.test(str)) return str;
  try {
    const fixed = decodeURIComponent(escape(str));
    return fixed;
  } catch (e) {
    return str;
  }
}
function fixMojibakeDeep(value) {
  if (typeof value === 'string') return fixMojibakeString(value);
  if (Array.isArray(value)) return value.map(fixMojibakeDeep);
  if (value && typeof value === 'object') {
    const out = {};
    for (const k in value) out[k] = fixMojibakeDeep(value[k]);
    return out;
  }
  return value;
}
async function repairMojibake(key, value) {
  const fixed = fixMojibakeDeep(value);
  if (JSON.stringify(fixed) !== JSON.stringify(value)) {
    await storageSet(key, fixed).catch(() => {});
    return fixed;
  }
  return value;
}

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function resizeImageFile(file, maxDim, quality) {
  maxDim = maxDim || 300; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lectura_fallida'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('imagen_invalida'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function parseVideoUrl(url) {
  try {
    const u = new URL(url);
    if (/youtu\.be$/.test(u.hostname)) return { tipo: 'youtube', id: u.pathname.slice(1) };
    if (/youtube\.com$/.test(u.hostname.replace('www.', ''))) {
      if (u.searchParams.get('v')) return { tipo: 'youtube', id: u.searchParams.get('v') };
      const m = u.pathname.match(/\/embed\/([^/]+)/);
      if (m) return { tipo: 'youtube', id: m[1] };
    }
    if (/vimeo\.com$/.test(u.hostname.replace('www.', '').replace('player.', ''))) {
      const m = u.pathname.match(/(\d+)/);
      if (m) return { tipo: 'vimeo', id: m[1] };
    }
    if (/drive\.google\.com$/.test(u.hostname)) {
      const m = u.pathname.match(/\/d\/([^/]+)/);
      if (m) return { tipo: 'drive', id: m[1] };
    }
    return { tipo: 'otro', id: null };
  } catch (e) {
    return { tipo: 'otro', id: null };
  }
}

function buildTimestampUrl(url, segundos) {
  const info = parseVideoUrl(url);
  const s = Math.max(0, Math.round(segundos || 0));
  if (info.tipo === 'youtube') return 'https://www.youtube.com/watch?v=' + info.id + '&t=' + s + 's';
  if (info.tipo === 'vimeo') return url.split('#')[0] + '#t=' + s + 's';
  return url;
}

<script type="text/babel" data-presets="react">
function FieldInput({ field, value, values, onChange }) {
  const base = 'field-input';
  return (
    <div>
      <label className="field-label mb-1 block">{field.label}{field.required ? ' *' : ''}</label>
      {field.type === 'computed' && (
        <input type="text" className={base} value={field.compute(values)} disabled readOnly />
      )}
      {field.type === 'textarea' && (
        <textarea rows={field.rows || 3} className={base} value={value ?? ''} onChange={e => onChange(e.target.value)} placeholder={field.placeholder} />
      )}
      {field.type === 'select' && (
        <select className={base} value={value ?? ''} onChange={e => onChange(e.target.value)}>
          <option value="">{field.placeholder || 'Selecciona…'}</option>
          {field.options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      )}
      {field.type === 'number' && (
        <input type="number" className={base} value={value ?? ''} onChange={e => onChange(e.target.value)} placeholder={field.placeholder} />
      )}
      {field.type === 'date' && (
        <input type="date" className={base} value={value ?? ''} onChange={e => onChange(e.target.value)} />
      )}
      {field.type === 'password' && (
        <input type="password" className={base} value={value ?? ''} onChange={e => onChange(e.target.value)} placeholder={field.placeholder} autoComplete="new-password" />
      )}
      {(!field.type || field.type === 'text') && (
        <input type="text" className={base} value={value ?? ''} onChange={e => onChange(e.target.value)} placeholder={field.placeholder} />
      )}
    </div>
  );
}

function EntityFormModal({ title, fields, initial, onSubmit, onClose, extraValidate, renderExtra, wide }) {
  const [values, setValues] = useState(initial || {});
  const toast = useToast();
  useEffect(() => { setValues(initial || {}); }, [initial]);
  function set(name, v) { setValues(s => ({ ...s, [name]: v })); }
  function handleSubmit(e) {
    e.preventDefault();
    for (const f of fields) {
      if (f.required && !String(values[f.name] ?? '').trim()) {
        toast.error('Falta el campo "' + f.label + '"');
        return;
      }
    }
    const err = extraValidate ? extraValidate(values) : null;
    if (err) { toast.error(err); return; }
    onSubmit(values);
  }
  return (
    <Modal title={title} onClose={onClose} wide={wide}>
      <form onSubmit={handleSubmit} className="space-y-4">
        {renderExtra && renderExtra(values, set)}
        <div className={wide ? 'grid grid-cols-1 sm:grid-cols-2 gap-4' : 'space-y-4'}>
          {fields.map(f => <FieldInput key={f.name} field={f} value={values[f.name]} values={values} onChange={v => set(f.name, v)} />)}

        <div className="flex justify-end gap-2 pt-2 border-t" style={{ borderColor: 'var(--border)' }}>

        </div>
      </form>
    </Modal>
  );
}

<script type="text/babel" data-presets="react">
const AppDataCtx = createContext(null);

function useDebouncedPersist(key, value, loading) {
  const first = useRef(true);
  const timer = useRef(null);
  useEffect(() => {
    if (loading) return;
    if (first.current) { first.current = false; return; }
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      storageSet(key, value).catch(() => {});
    }, 800);
    return () => clearTimeout(timer.current);
  }, [value, loading]);
}

function AppDataProvider({ children }) {
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [players, setPlayers] = useState([]);
  const [staff, setStaff] = useState([]);
  const [teams, setTeams] = useState([]);
  const [matches, setMatches] = useState([]);
  const [videos, setVideos] = useState(SEED_VIDEOS);
  const [users, setUsers] = useState([]);
  const [settings, setSettings] = useState(SEED_SETTINGS);
  const [activity, setActivity] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        await initCapabilities();
        const seedMatches = () => SEED_TEAMS.length ? seedMatch(SEED_TEAMS, SEED_PLAYERS) : [];
        let [pl, st, tm, us, se, ac] = await Promise.all([
          loadKey('players', SEED_PLAYERS),
          loadKey('staff', SEED_STAFF),
          loadKey('teams', SEED_TEAMS),
          loadKey('users', SEED_USERS),
          loadKey('settings', SEED_SETTINGS),
          loadKey('activity', SEED_ACTIVITY),
        ]);
        let vd;
        try { vd = await storageGet('videos'); } catch (e) { vd = SEED_VIDEOS; await storageSet('videos', vd).catch(() => {}); }
        let mt;
        try { mt = await storageGet('matches'); } catch (e) { mt = seedMatches(); await storageSet('matches', mt).catch(() => {}); }
        pl = await repairMojibake('players', pl);
        st = await repairMojibake('staff', st);
        tm = await repairMojibake('teams', tm);
        us = await repairMojibake('users', us);
        ac = await repairMojibake('activity', ac);
        mt = await repairMojibake('matches', mt);
        setPlayers(pl); setStaff(st); setTeams(tm); setUsers(us); setSettings(se); setActivity(ac); setVideos(vd); setMatches(mt);
        try {
          const lastId = localStorage.getItem('sporting_last_user');
          if (lastId) {
            const u = us.find(x => x.id === lastId && x.activo !== false);
            if (u) setCurrentUser(u);
          }
        } catch (e) {}
      } catch (e) {
        setLoadError(e && e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  useDebouncedPersist('players', players, loading);
  useDebouncedPersist('staff', staff, loading);
  useDebouncedPersist('teams', teams, loading);
  useDebouncedPersist('matches', matches, loading);
  useDebouncedPersist('videos', videos, loading);
  useDebouncedPersist('users', users, loading);
  useDebouncedPersist('settings', settings, loading);
  useDebouncedPersist('activity', activity, loading);

  function pushActivity(accion, detalle) {
    setActivity(list => {
      const entry = { ts: Date.now(), usuario: currentUser ? currentUser.usuario : 'sistema', accion, detalle: detalle || '' };
      return [entry, ...list].slice(0, 200);
    });
  }

  function login(user) {
    setCurrentUser(user);
    try { localStorage.setItem('sporting_last_user', user.id); } catch (e) {}
  }
  function logout() {
    pushActivity('Cierre de sesión', currentUser ? currentUser.usuario : '');
    setCurrentUser(null);
    try { localStorage.removeItem('sporting_last_user'); } catch (e) {}
  }

  function canDo(modulo, nivel) { return can(currentUser, settings, modulo, nivel); }

  const value = {
    loading, loadError,
    players, setPlayers, staff, setStaff, teams, setTeams, matches, setMatches,
    videos, setVideos, users, setUsers, settings, setSettings, activity, pushActivity,
    currentUser, login, logout, canDo,
  };
  return <AppDataCtx.Provider value={value}>{children}</AppDataCtx.Provider>;
}
function useAppData() { return useContext(AppDataCtx); }
</script>

    setBusy(true);
    try {
      const passwordHash = await sha256(password);
      const admin = { id: uid('u'), usuario: usuario.trim(), passwordHash, rol: 'Administrador', activo: true };

      login(admin);

function MonthCalendar({ matches, teams, onSelect }) {
  const [ref, setRef] = useState(() => new Date());
  const year = ref.getFullYear(), month = ref.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const byDay = {};
  matches.forEach(m => {
    const d = new Date(m.fecha + 'T00:00:00');
    if (d.getFullYear() === year && d.getMonth() === month) {
      byDay[d.getDate()] = byDay[d.getDate()] || [];
      byDay[d.getDate()].push(m);
    }
  });
  return (
    <div className="card p-4">
      <div className="flex items-center justify-between mb-3">
        <button className="icon-btn" onClick={() => setRef(new Date(year, month - 1, 1))}><Icon name="chevronLeft" /></button>
        <div className="font-display font-semibold capitalize">{ref.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</div>
        <button className="icon-btn" onClick={() => setRef(new Date(year, month + 1, 1))}><Icon name="chevronRight" /></button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center text-[11px] text-muted mb-1">
        {['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => <div key={d}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((d, i) => (
          <div key={i} className="min-h-[52px] rounded-lg p-1 text-xs" style={{ background: d ? 'var(--surface-2)' : 'transparent' }}>
            {d && <div className="text-muted mb-0.5">{d}</div>}
            {d && (byDay[d] || []).map(m => {
              const rival = teams.find(t => t.id === m.rivalId);
              return (
                <button key={m.id} onClick={() => onSelect(m)} className="w-full text-left rounded px-1 py-0.5 mb-0.5 truncate" style={{ background: 'var(--club-red)', color: '#fff', fontSize: 10 }}>
                  {rival ? rival.nombre : 'Rival'}
                </button>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function PartidosScreen() {
  const { matches, setMatches, teams, canDo, pushActivity } = useAppData();
  const toast = useToast();
  const confirm = useConfirm();
  const [vista, setVista] = useState('lista');
  const [creating, setCreating] = useState(false);
  const [activeMatchId, setActiveMatchId] = useState(null);

  const canEdit = canDo('partidos', 'editar');
  const canDelete = canDo('partidos', 'eliminar');
  const activeMatch = matches.find(m => m.id === activeMatchId);
  const sorted = [...matches].sort((a, b) => a.fecha.localeCompare(b.fecha));

  function createMatch(values) {
    const nm = blankMatchPlan(values);
    setMatches(list => [...list, nm]);
    pushActivity('Creó partido', (teams.find(t => t.id === values.rivalId) || {}).nombre || '');
    toast.success('Partido creado');
    setCreating(false);
    setActiveMatchId(nm.id);
  }

  async function deleteMatch(m) {
    const ok = await confirm({ title: 'Eliminar partido', message: 'Se perderá todo el plan, convocatoria y pizarras de este partido.', danger: true, confirmLabel: 'Eliminar' });
    if (!ok) return;
    setMatches(list => list.filter(x => x.id !== m.id));
    toast.success('Partido eliminado');
    setActiveMatchId(null);
  }

  if (activeMatch) {
    return <MatchDetailScreen match={activeMatch} onBack={() => setActiveMatchId(null)} onDelete={() => deleteMatch(activeMatch)} canEdit={canEdit} canDelete={canDelete} />;
  }

  return (
    <div className="p-4 md:p-6 max-w-6xl mx-auto space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="font-display text-2xl font-bold">Partidos</h1>
        <div className="flex items-center gap-2">
          <div className="flex gap-1 surface-2 rounded-lg p-1">
            <button className={'icon-btn ' + (vista === 'lista' ? 'club-bg' : '')} style={vista === 'lista' ? { color: '#fff' } : {}} onClick={() => setVista('lista')}><Icon name="list" size={16} /></button>
            <button className={'icon-btn ' + (vista === 'calendario' ? 'club-bg' : '')} style={vista === 'calendario' ? { color: '#fff' } : {}} onClick={() => setVista('calendario')}><Icon name="calendar" size={16} /></button>
          </div>
          {canEdit && <button className="btn btn-primary" onClick={() => setCreating(true)} disabled={!teams.length}><Icon name="plus" size={16} />Crear partido</button>}
        </div>
      </div>
      {!teams.length && <p className="text-sm text-muted">Añade primero un equipo rival en el módulo Equipos.</p>}

      {vista === 'calendario' ? (
        <MonthCalendar matches={matches} teams={teams} onSelect={m => setActiveMatchId(m.id)} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {sorted.map(m => <MatchCard key={m.id} match={m} rival={teams.find(t => t.id === m.rivalId)} onClick={() => setActiveMatchId(m.id)} />)}
          {!sorted.length && <EmptyState icon="calendar" text="Todavía no hay partidos creados." />}
        </div>
      )}

      {creating && (
        <EntityFormModal title="Nuevo partido" fields={matchFormFields(teams)} initial={{ condicion: 'local' }} onSubmit={createMatch} onClose={() => setCreating(false)} wide />
      )}
    </div>
  );
}

<script type="text/babel" data-presets="react">
function updateMatch(setMatches, matchId, updater) {
  setMatches(list => list.map(m => m.id === matchId ? updater(m) : m));
}

function TextBlock({ label, value, onChange, rows, disabled }) {
  return (
    <div>
      <label className="field-label mb-1 block">{label}</label>
      <textarea className="field-input" rows={rows || 4} value={value || ''} disabled={disabled}
        onChange={e => onChange(e.target.value)} />

  );
}

function PlanTab({ match, setMatches, canEdit }) {

  const toast = useToast();
  const [saving, setSaving] = useState(false);
  const plan = match.plan;
  function setPlan(patch) {
    updateMatch(setMatches, match.id, m => ({ ...m, plan: { ...m.plan, ...patch } }));
  }
  function setNested(section, field, value) {
    updateMatch(setMatches, match.id, m => ({ ...m, plan: { ...m.plan, [section]: { ...m.plan[section], [field]: value } } }));
  }
  async function guardarPlan() {
    setSaving(true);
    try {
      await storageSet('matches', matches);
      toast.success('Plan de partido guardado');

          <TextBlock label="Defensa organizada" value={plan.fases.defOrg} disabled={!canEdit} onChange={v => setNested('fases', 'defOrg', v)} />

function ConvocatoriaTab({ match, setMatches, canEdit }) {
  const { players } = useAppData();
  const conv = match.convocatoria;
  const toast = useToast();

  function toggleConvocado(id) {
    updateMatch(setMatches, match.id, m => {
      const conv = m.convocatoria;
      const on = conv.convocados.includes(id);
      const convocados = on ? conv.convocados.filter(x => x !== id) : [...conv.convocados, id];
      const titulares = conv.titulares.filter(x => convocados.includes(x));
      let suplentes = conv.suplentes.filter(x => convocados.includes(x));
      // Un convocado nuevo no es titular por defecto, así que entra directo al banquillo.
      if (!on) suplentes = [...suplentes, id];
      return { ...m, convocatoria: { convocados, titulares, suplentes } };
    });
  }
  function toggleTitular(id) {
    updateMatch(setMatches, match.id, m => {
      const conv = m.convocatoria;
      const isTitular = conv.titulares.includes(id);
      if (!isTitular && conv.titulares.length >= 11) { toast.error('Ya hay 11 titulares seleccionados'); return m; }
      const titulares = isTitular ? conv.titulares.filter(x => x !== id) : [...conv.titulares, id];
      const suplentes = isTitular ? [...conv.suplentes, id] : conv.suplentes.filter(x => x !== id);
      return { ...m, convocatoria: { ...conv, titulares, suplentes } };
    });
  }

  const convocadosPlayers = players.filter(p => conv.convocados.includes(p.id));
  const avisos = convocadosPlayers.filter(p => p.estado === 'lesionado' || p.estado === 'sancionado');

  return (
    <div className="space-y-5 max-w-3xl">
      {avisos.length > 0 && (
        <div className="card p-3 flex items-start gap-2" style={{ borderColor: 'var(--warn)', background: 'var(--warn-bg)' }}>
          <Icon name="alertTriangle" style={{ color: 'var(--warn)' }} className="mt-0.5 shrink-0" />
          <div className="text-sm">
            <b>Atención:</b> {avisos.map(p => p.nombre + ' (' + ESTADOS[p.estado].label + ')').join(', ')}
          </div>
        </div>
      )}
      <div>
        <h3 className="font-display font-semibold text-lg mb-2">Convocados <span className="text-muted text-sm font-normal">({conv.convocados.length})</span></h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {players.map(p => {
            const on = conv.convocados.includes(p.id);
            return (
              <label key={p.id} className="flex items-center gap-2 card px-3 py-2 cursor-pointer" style={{ opacity: canEdit ? 1 : 0.85 }}>
                <input type="checkbox" checked={on} disabled={!canEdit} onChange={() => toggleConvocado(p.id)} className="w-4 h-4 shrink-0" />
                <Avatar fotoKey={p.fotoKey} dorsal={p.dorsal} size={28} />
                <span className="text-sm truncate flex-1">{p.nombre}</span>
                {(p.estado === 'lesionado' || p.estado === 'sancionado') && <Icon name="alertTriangle" size={14} style={{ color: 'var(--warn)' }} />}
              </label>
            );
          })}
        </div>
      </div>
      <div>
        <h3 className="font-display font-semibold text-lg mb-2">Once titular <span className="text-muted text-sm font-normal">({conv.titulares.length}/11)</span></h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {convocadosPlayers.map(p => {
            const on = conv.titulares.includes(p.id);
            return (
              <button key={p.id} disabled={!canEdit} onClick={() => toggleTitular(p.id)}
                className="flex items-center gap-2 rounded-lg px-3 py-2 text-left"
                style={{ background: on ? 'var(--club-red)' : 'var(--surface-2)', color: on ? '#fff' : 'var(--text)' }}>
                <Avatar fotoKey={p.fotoKey} dorsal={p.dorsal} size={26} />
                <span className="text-sm truncate">{p.nombre}</span>
              </button>
            );
          })}
          {!convocadosPlayers.length && <p className="text-sm text-muted col-span-full">Selecciona primero a los convocados.</p>}
        </div>
      </div>
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
const TOOLS = [
  { key: 'mover', label: 'Mover', icon: 'grid' },
  { key: 'flecha-mov', label: 'Flecha de movimiento', icon: 'moveArrow' },
  { key: 'flecha-pase', label: 'Flecha de pase', icon: 'passArrow' },
  { key: 'zona', label: 'Zona', icon: 'square' },
  { key: 'cono', label: 'Cono', icon: 'triangle' },
  { key: 'texto', label: 'Texto', icon: 'type' },
];

function getSvgPoint(svg, clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  const p = pt.matrixTransform(ctm.inverse());
  return { x: p.x, y: p.y };
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function PitchMarkings() {
  return (
    <g stroke="var(--pitch-line)" strokeWidth="0.35" fill="none">
      <rect x="0.3" y="0.3" width="104.4" height="67.4" />
      <line x1="52.5" y1="0.3" x2="52.5" y2="67.7" />
      <circle cx="52.5" cy="34" r="9.15" />
      <circle cx="52.5" cy="34" r="0.4" fill="var(--pitch-line)" />
      <rect x="0.3" y="13.84" width="16.5" height="40.32" />
      <rect x="88.2" y="13.84" width="16.5" height="40.32" />
      <rect x="0.3" y="24.84" width="5.5" height="18.32" />
      <rect x="99.2" y="24.84" width="5.5" height="18.32" />
      <circle cx="11" cy="34" r="0.4" fill="var(--pitch-line)" />
      <circle cx="94" cy="34" r="0.4" fill="var(--pitch-line)" />
    </g>
  );
}

function FichaToken({ x, y, dorsal, nombre, selected, onPointerDown }) {
  const shortName = (nombre || '').split(' ').slice(-1)[0];
  return (
    <g transform={'translate(' + x + ',' + y + ')'} onPointerDown={onPointerDown} style={{ cursor: 'grab' }}>
      {selected && <circle r="4.6" fill="none" stroke="#fbbf24" strokeWidth="0.6" />}
      <circle r="3.6" fill="#ffffff" stroke="var(--club-red)" strokeWidth="0.5" />
      <text textAnchor="middle" dy="1.2" fontSize="3.4" fontWeight="700" fill="var(--club-red)">{dorsal}</text>
      <text textAnchor="middle" y="6.2" fontSize="2.3" fill="#ffffff" style={{ paintOrder: 'stroke', stroke: '#00000090', strokeWidth: 0.6 }}>{shortName}</text>
    </g>
  );
}

function DrawingShape({ d }) {
  const stroke = d.tipo === 'flecha-pase' ? '#1F2937' : d.tipo === 'zona' ? 'none' : 'var(--club-red)';
  if (d.tipo === 'flecha-mov' || d.tipo === 'flecha-pase') {
    return (
      <line x1={d.x1} y1={d.y1} x2={d.x2} y2={d.y2} stroke={stroke} strokeWidth="0.6"
        strokeDasharray={d.tipo === 'flecha-pase' ? '2 1.4' : undefined}
        markerEnd={'url(#arrow-' + (d.tipo === 'flecha-pase' ? 'pass' : 'move') + ')'} />
    );
  }
  if (d.tipo === 'zona') {
    const x = Math.min(d.x1, d.x2), y = Math.min(d.y1, d.y2);
    const w = Math.abs(d.x2 - d.x1), h = Math.abs(d.y2 - d.y1);
    return <rect x={x} y={y} width={w} height={h} fill="var(--club-red)" fillOpacity="0.22" stroke="var(--club-red)" strokeWidth="0.3" />;
  }
  if (d.tipo === 'cono') {
    return <polygon points={(d.x - 1.4) + ',' + (d.y + 1.6) + ' ' + (d.x + 1.4) + ',' + (d.y + 1.6) + ' ' + d.x + ',' + (d.y - 1.8)} fill="#f97316" stroke="#9a3412" strokeWidth="0.2" />;
  }
  if (d.tipo === 'texto') {
    return <text x={d.x} y={d.y} fontSize="3.2" fontWeight="600" fill="#111827">{d.texto}</text>;
  }
  return null;
}
